<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bussvisaren</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bussvisaren">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@600;700&display=swap">
<style>
/* Avgångstavla med två riktningar som flikar. Data direkt från SL:s öppna API. */
:root{
  --bg:#ECF0F4; --surface:#FFFFFF; --ink:#132030; --muted:#5A6878; --line:#D3DBE4;
  --accent:#C98200; --accent-ink:#1B1300; --late:#B4441B; --bus:#1D5DA6; --badge-ink:#FFFFFF; --ok:#2E9E5B;
  --tab-bg:#DCE3EB;
  --f-body:"Overpass",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Overpass Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0A1018; --surface:#111A25; --ink:#E5EBF2; --muted:#8B99AA; --line:#223042;
  --accent:#F2B43A; --accent-ink:#1B1300; --late:#F08A5D; --bus:#3D84D8; --badge-ink:#FFFFFF; --ok:#4CC27E;
  --tab-bg:#18232F; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:max(32px,env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0 0 2px}
h1{font-weight:800;font-size:1.75rem;letter-spacing:-.01em;margin:0;line-height:1.1}
.clock{font-family:var(--f-mono);font-weight:700;font-size:1.75rem;font-variant-numeric:tabular-nums;line-height:1}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--tab-bg);border-radius:10px;padding:4px}
.tab{font:inherit;font-weight:600;color:var(--muted);background:transparent;border:0;border-radius:7px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.tab small{font-weight:400;font-size:.75rem}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.status{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.875rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--ok)}
.dot.busy{background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot.busy{animation:none}}
.spacer{flex:1}
button.act{font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5}
.notice{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--late);border-radius:8px;padding:12px 14px;margin:0}
#board{display:flex;flex-direction:column;gap:16px}
.stop{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stop.reserve{border-style:dashed}
.stop.reserve .badge{background:var(--muted)}
.stop-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.stop-name{font-weight:800;font-size:1.125rem;margin:0}
.stop-meta{color:var(--muted);font-size:.8125rem}
ol.deps{list-style:none;margin:0;padding:0}
.dep{display:grid;grid-template-columns:3.25rem minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line)}
.dep:first-child{border-top:0}
.dep.miss{opacity:.55}
.badge{font-family:var(--f-mono);font-weight:700;font-size:1rem;background:var(--bus);color:var(--badge-ink);border-radius:6px;text-align:center;padding:3px 0 1px}
.dest{min-width:0}
.dest-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dest-meta{color:var(--muted);font-size:.8125rem;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.late{color:var(--late);font-weight:600}
.chip{display:inline-block;font-size:.75rem;font-weight:700;border-radius:4px;padding:1px 6px 0;line-height:1.4}
.chip.walk{color:var(--ok);border:1px solid var(--ok)}
.chip.run{background:var(--accent);color:var(--accent-ink)}
.chip.miss{color:var(--muted);border:1px solid var(--line)}
.time{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;line-height:1.1}
.mins{font-weight:700;font-size:1.25rem}
.mins small{font-size:.75rem;font-weight:600;margin-left:2px}
.at{color:var(--muted);font-size:.8125rem}
.now{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:2px 8px 0;font-size:1rem}
.empty{padding:16px;color:var(--muted)}
.devs{padding:10px 16px;border-top:1px solid var(--line);font-size:.875rem;color:var(--muted)}
.reco{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:4px}
.reco.run{border-left-color:var(--accent)}
.reco.none{border-left-color:var(--late)}
.reco p{margin:0}
.reco-label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.reco-main{font-weight:800;font-size:1.25rem;line-height:1.2}
.reco-sub{color:var(--muted);font-size:.875rem}
footer{color:var(--muted);font-size:.8125rem;text-align:center}
footer a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow" id="eyebrow">Bussar mot</p>
      <h1 id="heading">Brommaplan</h1>
    </div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <div class="tabs" role="tablist" aria-label="Riktning">
    <button class="tab" role="tab" id="tab-ut" data-key="ut" type="button">Till Brommaplan<small>Vägskälet · Träkvista</small></button>
    <button class="tab" role="tab" id="tab-hem" data-key="hem" type="button">Hem<small>Från Brommaplan</small></button>
  </div>

  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">Hämtar…</span>
    <span class="spacer"></span>
    <button class="act" id="refreshBtn" type="button">Uppdatera</button>
  </div>

  <p class="notice" id="notice" hidden></p>

  <div id="board" aria-live="polite" role="tabpanel"></div>

  <footer>Realtid från SL via <a href="https://www.trafiklab.se/" target="_blank" rel="noopener">Trafiklab</a>. Uppdateras varje minut medan sidan är öppen.</footer>
</div>

<script>
(function(){
  const API = "https://transport.integration.sl.se/v1/sites/";
  const FINDER = "https://journeyplanner.integration.sl.se/v2/stop-finder?type_sf=any&any_obj_filter_sf=2&name_sf=";
  const FORECAST_MIN = 90;
  const REFRESH_MS = 60000;

  const TABS = {
    ut: {
      eyebrow: "Bussar mot", heading: "Brommaplan",
      stops: [{n:"Sanduddens vägskäl", id:3081}, {n:"Träkvista", id:3065}],
      // Slutstation Brommaplan (309, 311), eller 176/177 mot Mörby station, som går via Brommaplan.
      keep: d => /brommaplan/i.test(d.t) || ((d.l === "177" || d.l === "176") && /mörby/i.test(d.t)),
      dedupe: true,
      emptyText: "Inga bussar mot Brommaplan de närmaste " + FORECAST_MIN + " minuterna."
    },
    hem: {
      eyebrow: "Bussar hem från", heading: "Brommaplan",
      stops: [{n:"Brommaplan", q:"Brommaplan"}, {n:"Reservalternativ", reserveOf:0}],
      // 177 går åt båda hållen från Brommaplan; bara turerna ut mot Ekerö går via Träkvista.
      keep: d => d.l === "309" || d.l === "311" || (d.l === "177" && !/mörby/i.test(d.t)),
      keepReserve: d => (d.l === "176" || d.l === "302") && !/mörby|brommaplan/i.test(d.t),
      alight: {"176": "Kliv av vid Ekvägen", "302": "Kliv av vid Träkvista idrottsplats"},
      // Utgångspunkt: man står vid tunnelbanedörren när tåget rullar in på Brommaplan.
      // Springa till bussen tar ca 2 min, gå ca dubbelt så lång tid.
      reachMin: 2,
      emptyText: "Inga avgångar med 309, 311 eller 177 de närmaste " + FORECAST_MIN + " minuterna."
    }
  };

  const $ = id => document.getElementById(id);
  const last = {ut:null, hem:null};
  let tab = pickTab();
  let busy = false;

  const pad = x => String(x).padStart(2,"0");
  const hm = d => pad(d.getHours())+":"+pad(d.getMinutes());
  const minutesUntil = iso => { const d = new Date(iso); return isNaN(d) ? null : Math.round((d - Date.now())/60000); };
  const upcoming = d => { const m = minutesUntil(d.e); return m===null || m >= -1; };
  const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };

  function pickTab(){
    const h = (location.hash || "").replace("#","");
    if(h === "ut" || h === "hem") return h;
    return new Date().getHours() < 12 ? "ut" : "hem";
  }

  // ---------- SL ----------
  async function siteId(stop){
    if(stop.id) return stop.id;
    const key = "sl_site_" + stop.q.toLowerCase();
    const cached = parseInt(store.get(key), 10);
    if(cached > 0) return stop.id = cached;
    const r = await fetch(FINDER + encodeURIComponent(stop.q));
    if(!r.ok) throw new Error("SL:s hållplatssök svarade " + r.status);
    const j = await r.json();
    const hits = (j.locations||[]).filter(l => l.id).map(l => ({id:parseInt(String(l.id).slice(-7),10), n:String(l.name)}));
    const hit = hits.find(h => h.n.toLowerCase().split(", ").pop() === stop.q.toLowerCase()) || hits[0];
    if(!hit) throw new Error("Hittade inte hållplatsen " + stop.q);
    store.set(key, String(hit.id));
    return stop.id = hit.id;
  }
  async function departures(id){
    let j = {departures:[]};
    for(let i=0; i<5; i++){            // SL svarar ibland tomt; fråga igen efter en kort paus
      if(i) await new Promise(r => setTimeout(r, 600));
      const r = await fetch(API + id + "/departures?forecast=" + FORECAST_MIN, {cache:"no-store"});
      if(!r.ok) throw new Error("SL svarade " + r.status);
      j = await r.json();
      if((j.departures||[]).length) break;
    }
    const dep = (j.departures||[]).map(d => ({
      l: d.line ? String(d.line.designation) : "", t: d.destination || "", s: d.display || "",
      e: d.expected || d.scheduled || "", p: d.scheduled || "",
      sp: (d.stop_point && d.stop_point.designation) || "", st: d.state || "",
      j: d.journey && d.journey.id ? String(d.journey.id) : null
    }));
    const dev = (j.stop_deviations||[]).map(x => x.message).filter(Boolean).slice(0,2);
    return {id, dep, dev, tot: dep.length};
  }

  async function refresh(){
    if(busy) return;
    const key = tab, cfg = TABS[key];
    busy = true; setStatus("busy");
    try{
      const real = cfg.stops.filter(s => s.reserveOf === undefined);
      const d = await Promise.all(real.map(async s => {
        try{ return await departures(await siteId(s)); }
        catch(e){ return {err: e.message, dep: []}; }
      }));
      const prev = last[key];
      const merged = d.map((x, i) => (x.tot === 0 && !x.err && prev && prev.d[i] && prev.d[i].dep.some(upcoming)) ? prev.d[i] : x);
      last[key] = {at: Date.now(), d: merged};
      $("notice").hidden = !d.every(x => x.err);
      if(d.every(x => x.err)) $("notice").textContent = "Kunde inte nå SL. Kontrollera uppkopplingen och tryck Uppdatera.";
    }finally{
      busy = false; if(key === tab){ render(); } setStatus();
    }
  }

  function setStatus(kind){
    const L = last[tab];
    $("dot").className = "dot" + (kind==="busy" ? " busy" : L ? " live" : "");
    $("refreshBtn").disabled = kind==="busy";
    if(kind==="busy"){ $("statusText").textContent = L ? "Uppdaterar…" : "Hämtar…"; return; }
    if(!L){ $("statusText").textContent = "Inga avgångar hämtade"; return; }
    const age = Math.round((Date.now()-L.at)/60000);
    $("statusText").textContent = "Uppdaterad " + hm(new Date(L.at)) + (age>=2 ? " · "+age+" min sedan" : "");
  }

  // ---------- Rendera ----------
  function reachState(d, reach){
    const mg = (new Date(d.e) - Date.now())/60000;
    return mg >= reach*2 ? {k:"walk", txt:"Hinner gå"} : mg >= reach ? {k:"run", txt:"Spring"} : {k:"miss", txt:"Hinner inte"};
  }

  function render(){
    const cfg = TABS[tab], L = last[tab];
    $("eyebrow").textContent = cfg.eyebrow;
    $("heading").textContent = cfg.heading;
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.key === tab ? "true" : "false"));
    const board = $("board"); board.textContent = "";
    board.setAttribute("aria-labelledby", "tab-" + tab);

    const firstDeps = L && L.d[0] ? L.d[0].dep.filter(cfg.keep).filter(upcoming) : [];
    const sameTrip = d => firstDeps.some(f => {
      if(f.j && d.j) return f.j === d.j;
      const diff = new Date(d.e) - new Date(f.e);
      return f.l === d.l && diff >= 0 && diff <= 6*60000;
    });

    if(cfg.reachMin && L && L.d[0] && !L.d[0].err && L.d[0].tot !== 0){
      const P = firstDeps.find(d => reachState(d, cfg.reachMin).k !== "miss");
      const res = L.d[0].dep.filter(cfg.keepReserve).filter(upcoming);
      const R = res.find(d => reachState(d, cfg.reachMin).k !== "miss" && (!P || new Date(P.e) - new Date(d.e) >= 10*60000));
      const st = P ? reachState(P, cfg.reachMin).k : null;
      const box = el("div", "reco" + (st === "run" ? " run" : !P ? " none" : ""));
      box.append(el("p", "reco-label", "När tåget rullar in på Brommaplan"));
      box.append(el("p", "reco-main", P
        ? (st === "run" ? "🏃 Spring till " : "🚶 Ta ") + P.l + " kl " + hm(new Date(P.e)) + (st === "run" ? " – den hinns bara om du springer" : " – du hinner gå")
        : "Ingen 309, 311 eller 177 som du hinner den närmaste timmen"));
      if(R) box.append(el("p", "reco-sub", "🔁 Tidigare: " + R.l + " kl " + hm(new Date(R.e)) + " – " + cfg.alight[R.l].toLowerCase() + (reachState(R, cfg.reachMin).k === "run" ? " (spring)" : "")));
      board.appendChild(box);
    }

    cfg.stops.forEach((s, idx) => {
      const isReserve = s.reserveOf !== undefined;
      const data = L ? L.d[isReserve ? s.reserveOf : idx] : null;
      const sec = el("section", "stop" + (isReserve ? " reserve" : ""));
      const head = el("div", "stop-head");
      head.append(el("h2", "stop-name", s.n), el("span", "stop-meta", isReserve ? "176 · 302" : tab === "hem" ? "309 · 311 · 177" : "Ekerö"));
      sec.appendChild(head);

      if(!data){ sec.appendChild(el("div", "empty", "Hämtar…")); board.appendChild(sec); return; }
      if(data.err){ sec.appendChild(el("div", "empty", "SL svarade inte för den här hållplatsen.")); board.appendChild(sec); return; }
      if(data.tot === 0){ sec.appendChild(el("div", "empty", "SL svarar tomt för " + (isReserve ? "Brommaplan" : s.n) + " just nu. Tryck Uppdatera om en stund.")); board.appendChild(sec); return; }

      if(isReserve){
        const nextGood = firstDeps.find(d => !cfg.reachMin || reachState(d, cfg.reachMin).k !== "miss") || null;
        const res = data.dep.filter(cfg.keepReserve).filter(upcoming);
        const before = (nextGood ? res.filter(d => new Date(d.e) < new Date(nextGood.e)) : res).slice(0,4);
        if(!before.length) sec.appendChild(el("div", "empty", nextGood ? "Ingen reservlinje går före nästa ordinarie buss (" + nextGood.l + " kl " + hm(new Date(nextGood.e)) + ")." : "Inga reservlinjer de närmaste " + FORECAST_MIN + " minuterna."));
        else { const ol = el("ol", "deps"); before.forEach(d => ol.appendChild(row(d, cfg.alight[d.l], cfg.reachMin))); sec.appendChild(ol); }
        board.appendChild(sec); return;
      }

      const all = data.dep.filter(cfg.keep).filter(upcoming);
      const deps = (cfg.dedupe && idx > 0 ? all.filter(d => !sameTrip(d)) : all).slice(0,6);
      if(!deps.length){
        const dupes = cfg.dedupe && idx > 0 && all.length > 0;
        sec.appendChild(el("div", "empty", dupes ? "Samma bussar som från " + cfg.stops[0].n + ", ungefär en minut senare." : cfg.emptyText));
      } else {
        const ol = el("ol", "deps"); deps.forEach(d => ol.appendChild(row(d, null, cfg.reachMin))); sec.appendChild(ol);
      }
      const devs = (data.dev||[]).filter(m => !(tab === "ut" && /mot skärvik/i.test(m)));
      if(devs.length) sec.appendChild(el("div", "devs", "⚠ " + devs.join(" · ")));
      board.appendChild(sec);
    });
  }

  function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text !== undefined) e.textContent = text; return e; }

  function row(d, alight, reach){
    const li = el("li", "dep");
    const rs = reach ? reachState(d, reach) : null;
    if(rs && rs.k === "miss") li.classList.add("miss");
    const dest = el("div", "dest");
    const dn = el("div", "dest-name", d.t); dn.title = d.t; dest.append(dn);
    const dm = el("div", "dest-meta");
    if(rs) dm.appendChild(el("span", "chip " + rs.k, rs.txt));
    if(alight) dm.appendChild(el("span", "", alight));
    if(!/brommaplan/i.test(d.t) && /mörby/i.test(d.t) && tab === "ut") dm.appendChild(el("span", "", "Via Brommaplan"));
    if(d.sp) dm.appendChild(el("span", "", "Läge " + d.sp));
    const delay = (d.e && d.p) ? Math.round((new Date(d.e) - new Date(d.p))/60000) : 0;
    if(delay >= 2) dm.appendChild(el("span", "late", "+" + delay + " min sen"));
    if(d.st === "CANCELLED") dm.appendChild(el("span", "late", "Inställd"));
    if(dm.children.length) dest.append(dm);

    const t = el("div", "time");
    const m = minutesUntil(d.e);
    const mins = el("div", "mins");
    if((m !== null && m <= 0) || d.s === "Nu") mins.appendChild(el("span", "now", "Nu"));
    else if(m !== null && m < 60){ mins.textContent = m; mins.appendChild(el("small", "", "min")); }
    else mins.textContent = d.e ? hm(new Date(d.e)) : d.s;
    t.append(mins);
    if(m !== null && m < 60 && d.e) t.append(el("div", "at", hm(new Date(d.e))));
    li.append(el("div", "badge", d.l || "–"), dest, t);
    return li;
  }

  // ---------- Händelser ----------
  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
    tab = b.dataset.key; render(); setStatus();
    if(!last[tab] || Date.now() - last[tab].at > 30000) refresh();
  }));
  $("refreshBtn").onclick = () => refresh();
  function tick(){ $("clock").textContent = hm(new Date()); }
  tick();
  setInterval(() => { tick(); if(!busy && last[tab]){ render(); setStatus(); } }, 15000);
  setInterval(() => { if(!document.hidden) refresh(); }, REFRESH_MS);
  document.addEventListener("visibilitychange", () => {
    if(!document.hidden && (!last[tab] || Date.now() - last[tab].at > 30000)){ tab = last[tab] ? tab : pickTab(); render(); refresh(); }
  });

  render(); refresh();
})();
</script>
</body>
</html>
